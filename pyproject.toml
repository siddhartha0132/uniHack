[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.2.0"
description = "Veritas — Industrial Product Intelligence API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "sqlalchemy==2.0.31",
    "alembic==1.13.2",
    "PyJWT==2.8.0",
    "python-multipart==0.0.12",
    "pymupdf==1.24.7",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.0",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["backend", "src"]
include = ["app*", "tests*", "ingestion*", "normalization*", "extraction*", "generation*", "evaluation*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v"

[tool.pyright]
include = [
    "backend/app/**/*.py",
    "backend/tests/**/*.py",
    "src/**/*.py"
]
exclude = [
    "**/test_*.py",
    "**/debug_*.py",
    "run_pipeline.py",
    "**/test_*.py",
]
extraPaths = [
    "backend",
    "src"
]
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnusedImport = false
reportUnusedVariable = false
reportGeneralTypeIssues = true
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalIterable = false
reportPrivateImportUsage = false

[tool.coverage.run]
source = ["backend/app", "src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/debug_*.py",
    "run_pipeline.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]